services:
  falkordb:
    image: falkordb/falkordb-server:latest
    ports:
      - "6379:6379"
      # FalkorDB browser on host port 3001 so it does not collide with the
      # Next.js dev server on 3000.
      - "3001:3000"
    volumes:
      - falkordb-data:/data
    restart: unless-stopped

volumes:
  falkordb-data:
