<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A network growing outward from one anchor transaction in two bounded hops">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e7e5" fill-opacity="0.09"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#f28c38" stop-opacity="0.24"/><stop offset="1" stop-color="#f28c38" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#0f1011"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#858985">
    <text x="64" y="96" font-size="20" letter-spacing="3" fill="#f28c38">02  TRACE</text>

    <circle cx="400" cy="500" r="150" fill="none" stroke="#e6e7e5" stroke-opacity="0.16" stroke-dasharray="3 8"/>
    <circle cx="400" cy="500" r="290" fill="none" stroke="#e6e7e5" stroke-opacity="0.12" stroke-dasharray="3 8"/>

    <g stroke="#e6e7e5" stroke-opacity="0.2" stroke-width="1.5" fill="none">
      <path d="M400 500 400 350M400 500 530 425M400 500 530 575M400 500 400 650M400 500 270 575M400 500 270 425"/>
      <path d="M400 350 330 232M400 350 470 232M530 425 650 372M530 425 672 470M530 575 672 530M530 575 650 628M400 650 470 768M400 650 330 768M270 575 150 628M270 575 128 530M270 425 128 470M270 425 150 372"/>
    </g>
    <path d="M400 500 530 575 650 628" fill="none" stroke="#f28c38" stroke-width="3" stroke-dasharray="7 9"/>

    <g fill="#131415" stroke="#e6e7e5" stroke-opacity="0.5" stroke-width="2">
      <circle cx="400" cy="350" r="15"/><circle cx="530" cy="425" r="15"/><circle cx="530" cy="575" r="15" stroke="#f28c38" stroke-opacity="1"/><circle cx="400" cy="650" r="15"/><circle cx="270" cy="575" r="15"/><circle cx="270" cy="425" r="15"/>
    </g>
    <g fill="#131415" stroke="#e6e7e5" stroke-opacity="0.4" stroke-width="1.5">
      <circle cx="330" cy="232" r="10"/><circle cx="470" cy="232" r="10"/><circle cx="650" cy="372" r="10"/><circle cx="672" cy="470" r="10"/><circle cx="672" cy="530" r="10"/><circle cx="650" cy="628" r="10" stroke="#f28c38" stroke-opacity="1"/><circle cx="470" cy="768" r="10"/><circle cx="330" cy="768" r="10"/><circle cx="150" cy="628" r="10"/><circle cx="128" cy="530" r="10"/><circle cx="128" cy="470" r="10"/><circle cx="150" cy="372" r="10"/>
    </g>

    <circle cx="400" cy="500" r="40" fill="none" stroke="#f28c38" stroke-opacity="0.35"/>
    <circle cx="400" cy="500" r="26" fill="#1a110a" stroke="#f28c38" stroke-width="3"/>
    <circle cx="400" cy="500" r="7" fill="#f28c38"/>

    <text x="400" y="460" text-anchor="middle" fill="#f28c38" font-size="15" dy="-30">anchor transaction</text>
    <text x="538" y="372" fill="#858985" font-size="14">hop 1</text>
    <text x="640" y="320" fill="#858985" font-size="14">hop 2</text>

    <text x="64" y="900" fill="#e6e7e5" font-size="18">Bounded Cypher: hops, time window, rows, duration</text>
    <rect x="64" y="930" width="148" height="40" rx="20" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/>
    <text x="138" y="956" text-anchor="middle" font-size="15">illustrative</text>
  </g>
</svg>
