<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A transfer flowing from one account through a transaction node to another, above a risk scale with a review threshold and a block rule">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e7e5" fill-opacity="0.09"/></pattern>
    <linearGradient id="fill" x1="0" x2="1"><stop offset="0" stop-color="#f28c38" stop-opacity="0.35"/><stop offset="1" stop-color="#f28c38"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8"><stop offset="0" stop-color="#f28c38" stop-opacity="0.22"/><stop offset="1" stop-color="#f28c38" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f28c38"/></marker>
  </defs>
  <rect width="800" height="1000" fill="#0f1011"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#858985">
    <text x="64" y="96" letter-spacing="3" fill="#f28c38">01  SCORE</text>

    <circle cx="180" cy="300" r="42" fill="#131415" stroke="#e6e7e5" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="368" y="268" width="64" height="64" rx="14" fill="#1a110a" stroke="#f28c38" stroke-width="2.5"/>
    <circle cx="620" cy="300" r="42" fill="#131415" stroke="#e6e7e5" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M226 300H360" stroke="#f28c38" stroke-width="2.5" stroke-dasharray="6 9" marker-end="url(#arrow)"/>
    <path d="M440 300H570" stroke="#f28c38" stroke-width="2.5" stroke-dasharray="6 9" marker-end="url(#arrow)"/>
    <text x="180" y="384" text-anchor="middle" font-size="16">account</text>
    <text x="400" y="384" text-anchor="middle" font-size="16" fill="#f28c38">transaction</text>
    <text x="620" y="384" text-anchor="middle" font-size="16">account</text>

    <text x="64" y="520" fill="#e6e7e5" font-size="22">Scored at its own timestamp</text>
    <text x="64" y="552" font-size="16">past-only graph features, nothing from later</text>

    <rect x="64" y="620" width="672" height="16" rx="8" fill="#e6e7e5" fill-opacity="0.08"/>
    <rect x="64" y="620" width="470" height="16" rx="8" fill="url(#fill)"/>
    <circle cx="534" cy="628" r="14" fill="#0f1011" stroke="#f28c38" stroke-width="3"/>
    <path d="M346 600v56" stroke="#e9b44c" stroke-width="2.5"/>
    <path d="M656 600v56" stroke="#ef6a62" stroke-width="2.5"/>
    <text x="346" y="694" text-anchor="middle" font-size="16" fill="#e9b44c">review threshold</text>
    <text x="656" y="694" text-anchor="middle" font-size="16" fill="#ef6a62">block rule</text>
    <text x="64" y="694" font-size="16">low</text>

    <rect x="64" y="860" width="148" height="40" rx="20" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/>
    <text x="138" y="886" text-anchor="middle" font-size="15">illustrative</text>
  </g>
</svg>
