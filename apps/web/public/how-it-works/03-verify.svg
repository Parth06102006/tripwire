<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Four claims checked against returned records: three verified and one rejected">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e7e5" fill-opacity="0.09"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8"><stop offset="0" stop-color="#f28c38" stop-opacity="0.18"/><stop offset="1" stop-color="#f28c38" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#0f1011"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#858985">
    <text x="64" y="96" font-size="20" letter-spacing="3" fill="#f28c38">03  VERIFY</text>
    <text x="64" y="160" fill="#e6e7e5" font-size="22">Every claim checked against the records</text>

    <g>
      <rect x="64" y="210" width="672" height="120" rx="16" fill="#141515" stroke="#e6e7e5" stroke-opacity="0.12"/>
      <circle cx="124" cy="270" r="22" fill="#78b887" fill-opacity="0.15" stroke="#78b887" stroke-width="2"/><path d="M114 270l8 8 14-16" fill="none" stroke="#78b887" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="172" y="248" width="360" height="12" rx="6" fill="#e6e7e5" fill-opacity="0.35"/><rect x="172" y="276" width="250" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>
      <rect x="590" y="254" width="120" height="32" rx="16" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/><text x="650" y="276" text-anchor="middle" font-size="14">tx ref</text>
    </g>
    <g>
      <rect x="64" y="360" width="672" height="120" rx="16" fill="#141515" stroke="#e6e7e5" stroke-opacity="0.12"/>
      <circle cx="124" cy="420" r="22" fill="#78b887" fill-opacity="0.15" stroke="#78b887" stroke-width="2"/><path d="M114 420l8 8 14-16" fill="none" stroke="#78b887" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="172" y="398" width="320" height="12" rx="6" fill="#e6e7e5" fill-opacity="0.35"/><rect x="172" y="426" width="280" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>
      <rect x="590" y="404" width="120" height="32" rx="16" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/><text x="650" y="426" text-anchor="middle" font-size="14">path ref</text>
    </g>
    <g>
      <rect x="64" y="510" width="672" height="120" rx="16" fill="#1a1211" stroke="#ef6a62" stroke-opacity="0.45"/>
      <circle cx="124" cy="570" r="22" fill="#ef6a62" fill-opacity="0.15" stroke="#ef6a62" stroke-width="2"/><path d="M114 560l20 20M134 560l-20 20" fill="none" stroke="#ef6a62" stroke-width="3" stroke-linecap="round"/>
      <rect x="172" y="548" width="300" height="12" rx="6" fill="#e6e7e5" fill-opacity="0.3"/><rect x="172" y="576" width="200" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.12"/>
      <rect x="560" y="554" width="150" height="32" rx="16" fill="#ef6a62" fill-opacity="0.12" stroke="#ef6a62" stroke-opacity="0.6"/><text x="635" y="576" text-anchor="middle" font-size="14" fill="#ef6a62">not in records</text>
    </g>
    <g>
      <rect x="64" y="660" width="672" height="120" rx="16" fill="#141515" stroke="#e6e7e5" stroke-opacity="0.12"/>
      <circle cx="124" cy="720" r="22" fill="#78b887" fill-opacity="0.15" stroke="#78b887" stroke-width="2"/><path d="M114 720l8 8 14-16" fill="none" stroke="#78b887" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="172" y="698" width="340" height="12" rx="6" fill="#e6e7e5" fill-opacity="0.35"/><rect x="172" y="726" width="230" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>
      <rect x="590" y="704" width="120" height="32" rx="16" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/><text x="650" y="726" text-anchor="middle" font-size="14">flow ref</text>
    </g>

    <text x="64" y="850" fill="#858985" font-size="16">Counter-evidence stays next to the supporting set.</text>
    <rect x="64" y="900" width="148" height="40" rx="20" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/>
    <text x="138" y="926" text-anchor="middle" font-size="15">illustrative</text>
  </g>
</svg>
