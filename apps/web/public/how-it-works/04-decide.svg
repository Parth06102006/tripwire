<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A review decision followed by an append-only case history: opened, confirmed by an analyst, evidence attached">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e6e7e5" fill-opacity="0.09"/></pattern>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.8"><stop offset="0" stop-color="#f28c38" stop-opacity="0.2"/><stop offset="1" stop-color="#f28c38" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="1000" fill="#0f1011"/>
  <rect width="800" height="1000" fill="url(#dots)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#858985">
    <text x="64" y="96" font-size="20" letter-spacing="3" fill="#f28c38">04  DECIDE</text>

    <rect x="64" y="170" width="190" height="56" rx="28" fill="#e9b44c" fill-opacity="0.12" stroke="#e9b44c" stroke-opacity="0.7" stroke-width="2"/>
    <text x="159" y="205" text-anchor="middle" font-size="20" letter-spacing="3" fill="#e9b44c">REVIEW</text>
    <text x="286" y="205" fill="#858985" font-size="16">policy decides, simulated</text>

    <path d="M120 330V780" stroke="#e6e7e5" stroke-opacity="0.2" stroke-width="2"/>

    <circle cx="120" cy="340" r="14" fill="#0f1011" stroke="#f28c38" stroke-width="3"/>
    <text x="168" y="334" fill="#e6e7e5" font-size="20">Case opened</text>
    <rect x="168" y="352" width="380" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>

    <circle cx="120" cy="520" r="14" fill="#0f1011" stroke="#78b887" stroke-width="3"/>
    <text x="168" y="514" fill="#e6e7e5" font-size="20">Analyst confirmed</text>
    <rect x="168" y="532" width="300" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>
    <rect x="168" y="556" width="150" height="30" rx="15" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/><text x="243" y="577" text-anchor="middle" font-size="14">reviewer id</text>

    <circle cx="120" cy="720" r="14" fill="#0f1011" stroke="#e6e7e5" stroke-opacity="0.5" stroke-width="3"/>
    <text x="168" y="714" fill="#e6e7e5" font-size="20">Evidence references kept</text>
    <rect x="168" y="732" width="340" height="10" rx="5" fill="#e6e7e5" fill-opacity="0.14"/>

    <text x="64" y="850" fill="#858985" font-size="16">History is append-only; a dismissal is never erased.</text>
    <rect x="64" y="900" width="148" height="40" rx="20" fill="none" stroke="#e6e7e5" stroke-opacity="0.2"/>
    <text x="138" y="926" text-anchor="middle" font-size="15">illustrative</text>
  </g>
</svg>
